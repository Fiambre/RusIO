name: Installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release --workspace

      - name: Build
        run: cargo build --release -p rusio

      - name: Version
        id: ver
        shell: bash
        run: |
          v=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build installer
        shell: bash
        run: |
          mkdir -p dist
          "/c/Program Files (x86)/NSIS/makensis.exe" -V2 "-DVERSION=${{ steps.ver.outputs.version }}" installer/rusio.nsi

      - uses: actions/upload-artifact@v4
        with:
          name: RusIO-Setup
          path: dist/RusIO-Setup-*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RusIO-Setup-*.exe
