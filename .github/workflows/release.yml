name: Installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release --workspace

      - name: Build
        run: cargo build --release -p rusio

      - name: Version
        id: ver
        shell: bash
        run: |
          v=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build installer
        shell: bash
        run: |
          mkdir -p dist
          "/c/Program Files (x86)/NSIS/makensis.exe" -V2 "-DVERSION=${{ steps.ver.outputs.version }}" installer/rusio.nsi

      # The in-app updater only runs an installer whose Ed25519 signature matches the public key
      # embedded in the app (crates/rusio-app/src/updates.rs). The private key is a repository secret.
      - name: Sign installer
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then echo "UPDATE_SIGNING_KEY secret is missing"; exit 1; fi
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/update-key.pem"
          openssl pkey -in "$RUNNER_TEMP/update-key.pem" -pubout -out "$RUNNER_TEMP/update-pub.pem"
          for f in dist/RusIO-Setup-*.exe; do
            openssl pkeyutl -sign -inkey "$RUNNER_TEMP/update-key.pem" -rawin -in "$f" -out "$f.sig"
            openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/update-pub.pem" -rawin -in "$f" -sigfile "$f.sig"
          done
          rm -f "$RUNNER_TEMP/update-key.pem"

      - uses: actions/upload-artifact@v4
        with:
          name: RusIO-Setup
          path: dist/RusIO-Setup-*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RusIO-Setup-*
